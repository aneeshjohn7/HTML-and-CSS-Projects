<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML Lists</title>
    <link rel="stylesheet" href="CSS_Lists.css" />
  </head>
  <body>
    <h1>HTML Lists Example</h1>

    <h2>Unordered List - My Hobbies</h2>
    <ul>
      <li>Reading</li>
      <li>Playing Cricket</li>
      <li>Listening to Music</li>
      <li>Travelling</li>
    </ul>

    <h2>Ordered List - Daily Activities</h2>
    <ol>
      <li>Wake up</li>
      <li>Have breakfast</li>
      <li>Attend classes</li>
      <li>Complete assignments</li>
    </ol>
  </body>

</html>
