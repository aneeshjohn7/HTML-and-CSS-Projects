
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My One Page Website</title>
</head>
<body>

    <header id="home">
        <h1>Welcome to My Website</h1>
        <p>This is my first one-page website using HTML.</p>
    </header>

    <nav>
        <a href="#home">Home</a> |
        <a href="#pictures">Pictures</a> |
        <a href="#videos">Videos</a> |
        <a href="#contact">Contact</a>
    </nav>

    <main>

        <section id="pictures">
            <h2>My Pictures</h2>
            <p>Here are some beautiful pictures.</p>

            <img src="https://picsum.photos/300/200" alt="Nature picture">
            <img src="https://picsum.photos/301/200" alt="Landscape picture">
        </section>

        <section id="videos">
            <h2>My Videos</h2>
            <p>Watch this sample video.</p>

            <iframe
                width="300"
                height="200"
                src="https://www.youtube.com/embed/ScMzIvxBSi4"
                title="Sample video"
                allowfullscreen>
            </iframe>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <br><br>

                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>

                <br><br>

                <input type="submit" value="Submit">
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 My One Page Website. All rights reserved.</p>
        <a href="#home">Back to Top</a>
    </footer>

</body>
</html>
